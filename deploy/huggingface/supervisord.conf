[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /data/pg -h 127.0.0.1 -k /tmp
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:kafka]
command=/opt/kafka/bin/kafka-server-start.sh /opt/churnpulse/deploy/kafka.properties
environment=KAFKA_HEAP_OPTS="-Xmx512m -Xms512m",LOG_DIR="/tmp/kafka-logs"
priority=10
stdout_logfile=/dev/null
redirect_stderr=true

[program:flink-jobmanager]
command=/opt/flink/bin/jobmanager.sh start-foreground
environment=FLINK_LOG_DIR="/tmp/flink-logs"
priority=20
stdout_logfile=/dev/null
redirect_stderr=true

[program:flink-taskmanager]
command=/opt/flink/bin/taskmanager.sh start-foreground
environment=FLINK_LOG_DIR="/tmp/flink-logs"
priority=20
stdout_logfile=/dev/null
redirect_stderr=true

[program:bootstrap]
command=/opt/churnpulse/deploy/bootstrap.sh
priority=30
autorestart=unexpected
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=uvicorn api.app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips=*
directory=/opt/churnpulse
priority=40
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:simulator]
command=python streaming/simulator/simulator.py
directory=/opt/churnpulse
priority=50
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -c /opt/churnpulse/deploy/nginx.conf -g "daemon off;"
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
