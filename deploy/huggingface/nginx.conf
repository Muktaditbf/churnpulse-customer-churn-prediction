# Public entry point on port 7860 (the port Hugging Face Spaces exposes).
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 7860;
    root /opt/churnpulse/web;
    index index.html;

    location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; client_max_body_size 5m; }
    location /ws/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 1h;
    }
    # Read-only Flink dashboard (job submission and cancelling are disabled).
    location /flink/ {
      limit_except GET { deny all; }
      proxy_pass http://127.0.0.1:8081/;
    }
    location / { try_files $uri /index.html; }
  }
}
