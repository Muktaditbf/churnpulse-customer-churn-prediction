server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve the API through Docker's DNS, so a restarted (re-addressed)
  # API container is found again instead of nginx calling a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  location /api/ { proxy_pass $api; proxy_set_header Host $host; client_max_body_size 20m; }
  location /ws/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }
  location / { try_files $uri /index.html; }
}
