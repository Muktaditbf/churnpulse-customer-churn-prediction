[project]
name = "churnpulse"
version = "1.0.0"
description = "Real-time customer churn prediction with Kafka, Flink, FastAPI and React"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "joblib==1.5.1",
    "pydantic==2.11.7",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.1",
    "lightgbm==4.6.0",
    "catboost==1.2.8",
    "faker==37.4.2",
    "optuna>=4.0",
    "shap==0.47.2",
    "mlflow>=2.16",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]
serving = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "confluent-kafka>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
    "httpx>=0.27",
]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnpulse"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# Broad excepts in the stream are deliberate: one bad event must never stop the job.
ignore = ["B904", "B008"]  # B008: FastAPI File()/Query() defaults are the documented idiom

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebooks.py" = ["E501"]  # notebook cell sources are long strings

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["e2e: needs the running Docker stack"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
